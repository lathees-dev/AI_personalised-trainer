<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluation Results</title>
    <style>
      /* General body styling */
      body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
        color: #333;
        margin: 0;
        padding: 20px;
        line-height: 1.6;
      }

      /* Header styling */
      header {
        text-align: center;
        margin-bottom: 30px;
      }

      header h1 {
        font-size: 28px;
        color: #444;
        border-bottom: 2px solid #ddd;
        padding-bottom: 10px;
      }

      /* Section styling */
      section {
        margin-bottom: 30px;
      }

      section h2 {
        font-size: 22px;
        color: #555;
        margin-bottom: 15px;
        text-decoration: underline;
      }

      /* Preformatted text */
      pre {
        background-color: #ffffff;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        white-space: pre-wrap; /* Ensures text wraps properly */
        word-wrap: break-word; /* Ensures long words wrap to the next line */
        font-family: 'Arial', 'Courier New', Courier, monospace;
        font-size: 16px;
        max-height: 400px;
        overflow-y: auto; /* Adds scroll for large content */
      }

      /* Scrollbar styling */
      pre::-webkit-scrollbar {
        width: 8px;
      }

      pre::-webkit-scrollbar-thumb {
        background-color: #888;
        border-radius: 5px;
      }

      pre::-webkit-scrollbar-thumb:hover {
        background-color: #555;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Video Evaluation Results</h1>
    </header>

    <!-- Section for Video Resume Feedback -->
    <section class="other-video-section">
      <h2>Video Resume Feedback</h2>
      <h3>Transcription</h3>
      <pre class="other-video-transcription">{{ transcription_other }}</pre>
      <h3>Evaluation</h3>
      <pre class="other-video-evaluation">{{ evaluation_other }}</pre>
    </section>
  </body>
</html>
